title: LWSpot
lwspot_version: "0.1.4"
description: >-
  LWSpot is a free, open-source Spotify client for Windows and Mac: a native
  app with no browser engine, themes, a Winamp mini player and MilkDrop.
lang: en-US
url: https://bjdevelopes.github.io
# GitHub Pages serves the site under the repository name, which is case
# sensitive: https://bjdevelopes.github.io/LWSpot/
baseurl: "/LWSpot"
logo: /assets/images/logo.svg
image: /assets/images/social-card.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/social-card.png
      topics:
        - Spotify client
        - Rust
        - egui
        - librespot
        - Spotify Connect
        - Windows music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /assets/images/social-card.png
      alt: LWSpot, a lightweight Spotify client for Windows and Mac, showing its Home page
    publisher:
      type: Organization
      name: LWSpot contributors
      url: https://github.com/BJDevelopes/lwspot
      same_as:
        - https://github.com/BJDevelopes/lwspot
  llms:
    title: LWSpot
    description: >-
      Documentation for LWSpot, a lightweight native Spotify client for
      Windows and macOS. It covers local playback, library access, and Spotify
      Connect.
    full: true
    details: >-
      Covers installation, sign-in, everyday use, settings, and Spotify
      connections. Source is on
      [GitHub](https://github.com/BJDevelopes/lwspot). LWSpot is a fork of
      [Spotifast](https://github.com/crmne/spotifast) by Carmine Paolino.
  branding:
    site_title: LWSpot
    logo:
      default: /assets/images/logo.svg
      alt: LWSpot
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Free and open source. <a href="https://buymeacoffee.com/bjdevelopes" target="_blank" rel="noreferrer">☕ Support LWSpot</a> ·
      A fork of <a href="https://github.com/crmne/spotifast" target="_blank" rel="noreferrer">Spotifast</a> by Carmine Paolino.
    copyright: >-
      <span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. LWSpot is an independent project, not affiliated with or endorsed by Spotify AB. Spotify is a trademark of Spotify AB.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/BJDevelopes/lwspot/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: BJDevelopes/lwspot
    text: Star
    show_count: true

plugins:
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-vitepress-theme

# Pages link to each other as Markdown files, so the same links work on
# GitHub and on the built site.
relative_links:
  enabled: true
  collections: true

exclude:
  - README.md
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
