[package]
name = "fastframe-tray"
description = "A tray item with the app's own menu: StatusNotifier on Linux, the notification area on Windows, the menu bar on macOS"
version = "0.4.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Carmine Paolino <carmine@paolino.me>"]
repository = "https://github.com/crmne/fastframe"
homepage = "https://github.com/crmne/fastframe"
readme = "README.md"
keywords = ["tray", "statusnotifier", "menu-bar", "egui", "desktop"]
categories = ["gui"]

[dependencies]
# Why no tray host was found, and what AppKit refused.
log = { version = "0.4", features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem over D-Bus, on its own thread. Already in both apps.
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The notification-area and menu-bar item, and its menu (muda). The version
# ZapFast and Spotifast build with.
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
# The tray thread's message loop.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock reopen handler, the headless AppKit pump, and the item's
# accessibility.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString"] }

# The workspace forbids unsafe code. This crate needs it for the Win32
# message loop and the Objective-C runtime, so it carries the workspace's
# lints with `unsafe_code` lowered to `deny`, allowed only in the modules that
# talk to the OS (`windows.rs`, `macos.rs`), each block with a SAFETY note.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
