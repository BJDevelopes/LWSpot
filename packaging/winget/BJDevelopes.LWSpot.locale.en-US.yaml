ShortDescription: A lightweight native Spotify client for Windows.
Description: |-
  LWSpot is a Spotify client for Windows written in Rust, with no browser
  engine. It plays music through librespot (Spotify Premium is needed for
  playback), controls other Spotify Connect devices, and includes synced
  lyrics, a ten-band equalizer, a Winamp-style mini player with classic
  skins, and optional MilkDrop visuals. It is a fork of Spotifast.
