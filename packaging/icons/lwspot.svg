<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- LWSpot: a feather (lightweight) wearing headphones (music), on violet. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#6D5BF0"/>
  <g transform="rotate(16 64 66)">
    <!-- A long, slim vane with one barb notch, so it reads as a feather. -->
    <path fill="#FFFFFF" d="M64 20
      C 77 29, 81 49, 78 65
      L 70 69
      L 77 74
      C 74 89, 69 99, 64 106
      C 59 99, 52 89, 50 77
      C 46 57, 50 33, 64 20 Z"/>
    <!-- Shaft through the vane, and the quill below it. -->
    <path d="M64 30 L 64 104" fill="none" stroke="#6D5BF0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M64 105 L 64 119" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <!-- Headphones: the band over the tip and a cup at each side. -->
    <path d="M41 50 C 41 6, 87 6, 87 50" fill="none" stroke="#21195C" stroke-width="6.5" stroke-linecap="round"/>
    <rect x="33" y="44" width="15" height="27" rx="7.5" fill="#21195C"/>
    <rect x="80" y="44" width="15" height="27" rx="7.5" fill="#21195C"/>
  </g>
</svg>
