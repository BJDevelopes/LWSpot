name: Bug report
description: Something does not work, or the app crashed or vanished.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        LWSpot runs on Windows only. Please include the log from LWSpot's last run:

        - Installed copy: `%LOCALAPPDATA%\LWSpot\data\lwspot.log`
        - Portable copy (a `data` folder beside `lwspot.exe`): `data\state\lwspot.log` in that folder

        If the app crashed or vanished, include `panic.log` from the same folder.
        Settings are in `%APPDATA%\LWSpot\config\settings.json` (portable:
        `data\config\settings.json`). Never attach anything from Windows
        Credential Manager or the `credential-storage` folder.
  - type: input
    id: version
    attributes:
      label: LWSpot version
      description: Shown under Settings > About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run LWSpot
      options:
        - Installed (setup.exe)
        - Portable ZIP
        - Built from source
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: System details
      description: Windows version and build, and whether the PC is x64 (Intel or AMD) or ARM.
      placeholder: "Windows 11 24H2, x64"
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Spotify plan
      options:
        - Premium
        - Free
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you do, and what happened instead?
      placeholder: "1. Signed in. 2. Pressed play on a playlist. 3. Nothing played; the button kept spinning."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: lwspot.log
      description: Reproduce the problem, quit the app, then paste the whole file here (and panic.log, if there is one). The path is above.
      render: text
    validations:
      required: true
