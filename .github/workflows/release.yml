name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # SignPath reads the artifacts it signs through the Actions API.
    permissions:
      contents: read
      actions: read
    env:
      CMAKE_GENERATOR: Ninja
      # Code signing is off until the SignPath Foundation accepts the
      # project and the repository variable is set (PACKAGING.md).
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vcpkg-triplet: x64-windows-static
            msvc-arch: x64
            pe-machine: 8664 machine \(x64\)
          # A native arm64 runner: the binaries are built, checked and started
          # on the processor they ship for, the MilkDrop add-on included.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            vcpkg-triplet: arm64-windows-static
            msvc-arch: arm64
            pe-machine: AA64 machine \(ARM64\)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the target's standard library to
      # the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      # No compiler cache: published binaries never build from outputs
      # restored from an Actions cache.
      # lwspot.exe has no projectM, so it needs nothing beyond Rust and MSVC.
      - name: Build LWSpot
        run: cargo build --release --locked --target ${{ matrix.target }} --no-default-features --bin lwspot
      # The MilkDrop add-on, which the app downloads the first time MilkDrop
      # is turned on. libprojectM reads OpenGL through GLEW; projectm-sys
      # builds against vcpkg's static-CRT triplet, matching
      # .cargo/config.toml.
      - name: GLEW for libprojectM
        run: vcpkg install glew:${{ matrix.vcpkg-triplet }}
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}
      - name: Build the MilkDrop add-on
        run: cargo build --release --locked --target ${{ matrix.target }} --features milkdrop --bin lwspot-milkdrop

      # The zip, the installer and the add-on must run on a clean Windows
      # machine without a separately installed Visual C++ redistributable.
      - name: Verify standalone Windows runtime
        shell: pwsh
        run: |
          foreach ($name in 'lwspot', 'lwspot-milkdrop') {
            $binary = "target\${{ matrix.target }}\release\$name.exe"
            $imports = & dumpbin /dependents $binary | Out-String
            $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
            if ($runtime) { throw "$name imports an MSVC runtime:`n$runtime" }
            # A portable copy's updater picks its download by the running
            # executable's architecture, and the installer installs this
            # binary on this processor, so a binary of the wrong one under
            # this name would keep those copies on the wrong architecture.
            # The app picks the add-on's download the same way.
            $headers = & dumpbin /headers $binary | Out-String
            if ($headers -notmatch '${{ matrix.pe-machine }}') { throw "$binary is not built for ${{ matrix.target }}:`n$headers" }
            # The app uses an add-on only when this names its own version.
            $version = (& $binary --version | Out-String).Trim()
            if ($version -notmatch "^$name \d+\.\d+\.\d+") { throw "Unexpected --version output: $version" }
          }

      # Optional code signing through SignPath, in this order: the two
      # programs first, so the zips and the installer carry signed copies;
      # then the installer itself, in the installer job; checksums.txt is
      # written last, by the publish job. SignPath takes and returns GitHub
      # artifacts; what it signs inside each is set by the artifact
      # configurations in packaging/signpath, copied into the SignPath
      # project.
      - name: Collect the programs to sign
        if: env.SIGN == 'true'
        shell: bash
        run: |
          mkdir -p unsigned/programs
          cp "target/${{ matrix.target }}/release/lwspot.exe" \
            "target/${{ matrix.target }}/release/lwspot-milkdrop.exe" unsigned/programs/
      - name: Upload the programs to sign
        id: unsigned-programs
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-programs-${{ matrix.target }}
          path: unsigned/programs/
          if-no-files-found: error
      - name: Sign the programs
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'lwspot' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.unsigned-programs.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/programs
      - name: Use the signed programs
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($name in 'lwspot', 'lwspot-milkdrop') {
            $signed = "signed\programs\$name.exe"
            $status = (Get-AuthenticodeSignature $signed).Status
            if ($status -ne 'Valid') { throw "$signed is not validly signed: $status" }
            Copy-Item $signed "target\${{ matrix.target }}\release\$name.exe" -Force
            $version = (& "target\${{ matrix.target }}\release\$name.exe" --version | Out-String).Trim()
            if ($version -notmatch "^$name \d+\.\d+\.\d+") { throw "Unexpected --version output after signing: $version" }
          }

      # Asset names follow fastframe-update's release contract (vendored in
      # vendor/fastframe-update): lwspot-<tag>-<target>.zip here, and
      # lwspot-<tag>-setup.exe from the installer job. The data folder makes
      # the copy keep its settings and caches beside itself (src/paths.rs);
      # an update replaces only lwspot.exe, so the folder and what is in it
      # stay.
      - name: Portable zip
        shell: bash
        run: |
          name="lwspot-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name/data"
          cp "target/${{ matrix.target }}/release/lwspot.exe" README.md LICENSE \
            packaging/lwspot-portable.txt "dist/$name/"
          cp packaging/portable-data-README.txt "dist/$name/data/README.txt"
          cd dist && 7z a "$name.zip" "$name"

      # The MilkDrop add-on on its own, as the app downloads it:
      # lwspot-milkdrop-<tag>-<target>.zip, listed in checksums.txt with the
      # rest. Deflate, which the app's zip reader inflates.
      - name: MilkDrop add-on zip
        shell: bash
        run: |
          name="lwspot-milkdrop-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/lwspot-milkdrop.exe" LICENSE "dist/$name/"
          cd "dist/$name" && 7z a -tzip -mm=Deflate "../$name.zip" lwspot-milkdrop.exe LICENSE

      # The universal installer is built from both targets' lwspot.exe by
      # the installer job, signed when signing is on.
      - uses: actions/upload-artifact@v7
        with:
          name: program-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/lwspot.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  # One installer for every PC: it carries both builds and installs the one
  # for the processor it runs on (packaging/windows/lwspot.iss).
  installer:
    name: universal installer
    needs: build
    runs-on: windows-latest
    # SignPath reads the artifacts it signs through the Actions API.
    permissions:
      contents: read
      actions: read
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: program-x86_64-pc-windows-msvc
          path: programs/x86_64
      - uses: actions/download-artifact@v7
        with:
          name: program-aarch64-pc-windows-msvc
          path: programs/aarch64
      # The build jobs checked each program on its own processor; this
      # checks that each one reached its place in the installer. The machine
      # field of the PE header: 0x8664 for x64, 0xAA64 for ARM64.
      - name: Check the programs
        shell: pwsh
        run: |
          foreach ($program in @(
              @{ Path = 'programs\x86_64\lwspot.exe'; Machine = 0x8664 },
              @{ Path = 'programs\aarch64\lwspot.exe'; Machine = 0xAA64 })) {
            $bytes = [IO.File]::ReadAllBytes($program.Path)
            $header = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $header + 4)
            if ($machine -ne $program.Machine) { throw ("{0} has machine 0x{1:X4}" -f $program.Path, $machine) }
          }
          $version = (& programs\x86_64\lwspot.exe --version | Out-String).Trim()
          if ($version -notmatch '^lwspot \d+\.\d+\.\d+') { throw "Unexpected --version output: $version" }

      # Inno Setup ships with the runner image. PowerShell, because bash on
      # Windows rewrites /D... arguments as paths.
      - name: Installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" `
            "/DBinaryX64=$PWD\programs\x86_64\lwspot.exe" `
            "/DBinaryArm64=$PWD\programs\aarch64\lwspot.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\lwspot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The installer goes to SignPath under a fixed name, so its artifact
      # configuration does not depend on the version.
      - name: Collect the installer to sign
        if: env.SIGN == 'true'
        shell: bash
        run: |
          mkdir -p unsigned/installer
          cp dist/*-setup.exe unsigned/installer/lwspot-setup.exe
      - name: Upload the installer to sign
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: unsigned/installer/
          if-no-files-found: error
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'lwspot' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installer
      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $signed = 'signed\installer\lwspot-setup.exe'
          $status = (Get-AuthenticodeSignature $signed).Status
          if ($status -ne 'Valid') { throw "$signed is not validly signed: $status" }
          $setup = Get-ChildItem dist\*-setup.exe
          Copy-Item $signed $setup.FullName -Force

      - uses: actions/upload-artifact@v7
        with:
          name: release-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  # The Mac app: one universal disk image for Apple silicon and Intel, named
  # as the updater looks for it, and the MilkDrop add-on for each processor.
  # Signed and notarized when the Apple secrets below are set (see
  # packaging/macos/README.md); otherwise signed ad hoc.
  macos:
    name: build (macOS)
    runs-on: macos-latest
    env:
      # The app and the MilkDrop add-on's C++ (projectM) both run on macOS
      # 11 and later; without this, C code targets the runner's own macOS.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: CMake
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      # A temporary keychain holding the Developer ID certificate, for
      # codesign; only when the secrets are set.
      - name: Signing keychain
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      # Signs, and with the Apple ID secrets notarizes and staples, the app
      # and the disk image (packaging/macos/build.sh).
      - name: LWSpot.app and disk image
        run: CODESIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" packaging/macos/build.sh
      - name: Check the app
        run: |
          app=dist/LWSpot.app/Contents/MacOS/lwspot
          lipo "$app" -verify_arch arm64 x86_64
          version="$($app --version)"
          echo "$version" | grep -Eq '^lwspot [0-9]+\.[0-9]+\.[0-9]+' || { echo "Unexpected --version output: $version"; exit 1; }
          codesign --verify --strict dist/LWSpot.app
      # The add-on as the app downloads it: lwspot-milkdrop-<tag>-<target>.zip
      # holding lwspot-milkdrop and the licence, deflated.
      - name: MilkDrop add-on zips
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" --features milkdrop --bin lwspot-milkdrop
            binary="target/$target/release/lwspot-milkdrop"
            arch=x86_64; [ "$target" = aarch64-apple-darwin ] && arch=arm64
            lipo "$binary" -verify_arch "$arch"
            if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
              codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            else
              # Apple silicon runs only signed code; ad hoc is enough for an
              # add-on the app downloads itself (no quarantine).
              codesign --force --sign - "$binary"
            fi
            name="lwspot-milkdrop-${GITHUB_REF_NAME}-$target"
            mkdir -p "dist/$name"
            cp "$binary" LICENSE "dist/$name/"
            (cd "dist/$name" && zip -X -9 "../$name.zip" lwspot-milkdrop LICENSE)
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [build, installer, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            packaging/release-download-guide.md
          sparse-checkout-cone-mode: false
      # Only the release files: the programs the installer was built from
      # and the unsigned uploads (when signing is on) are not part of the
      # release.
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      # The updater verifies every download against checksums.txt (the
      # installer, the portable zips and the MilkDrop add-on), so it is
      # written from the final, signed files, once all of them are here.
      - name: Checksums
        working-directory: dist
        run: |
          for name in "lwspot-${GITHUB_REF_NAME}-setup.exe" \
            "lwspot-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" \
            "lwspot-${GITHUB_REF_NAME}-aarch64-pc-windows-msvc.zip" \
            "lwspot-milkdrop-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" \
            "lwspot-milkdrop-${GITHUB_REF_NAME}-aarch64-pc-windows-msvc.zip" \
            "lwspot-${GITHUB_REF_NAME}-macos-universal.dmg" \
            "lwspot-milkdrop-${GITHUB_REF_NAME}-aarch64-apple-darwin.zip" \
            "lwspot-milkdrop-${GITHUB_REF_NAME}-x86_64-apple-darwin.zip"; do
            test -f "$name" || { echo "Missing release file: $name"; exit 1; }
          done
          sha256sum -- *.zip *-setup.exe *.dmg > checksums.txt && cat checksums.txt
      # The release text is the tag's section of CHANGELOG.md
      # ("## [X.Y.Z] - date" up to the next "## ["). A tag without one, such
      # as a release candidate, gets notes generated from the pull requests.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            /^## \[/ { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found && /^\[.+\]: http/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md" || true
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            # A "Which file do I need?" guide above the changelog section.
            sed "s/{TAG}/${GITHUB_REF_NAME}/g" packaging/release-download-guide.md               > "$RUNNER_TEMP/release-body.md"
            cat "$RUNNER_TEMP/release-notes.md" >> "$RUNNER_TEMP/release-body.md"
            mv "$RUNNER_TEMP/release-body.md" "$RUNNER_TEMP/release-notes.md"
            echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section for $version; generating notes"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          name: LWSpot ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          # A tag with a suffix (v0.1.0-rc1) is a pre-release: it stays off
          # "latest", so the app's update check never offers it.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Opens the pull request to microsoft/winget-pkgs for a new stable
  # release. Off until the repository variable WINGET_SUBMIT is "true",
  # which only makes sense once the first version has been accepted there
  # by hand (PACKAGING.md): wingetcreate updates an existing package.
  # WINGET_TOKEN is a classic personal access token with the public_repo
  # scope, of an account with a fork of microsoft/winget-pkgs.
  winget:
    name: winget pull request
    needs: publish
    if: vars.WINGET_SUBMIT == 'true' && !contains(github.ref_name, '-')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME"
          # One installer for both architectures: it installs the build for
          # the processor it runs on.
          $setup = "$base/lwspot-$env:GITHUB_REF_NAME-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update BJDevelopes.LWSpot --version $version --urls "$setup|x64" "$setup|arm64" `
            --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
