name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vcpkg-triplet: x64-windows-static
            msvc-arch: x64
            pe-machine: 8664 machine \(x64\)
          # A native arm64 runner: the binary is built, checked and started on
          # the processor it ships for, MilkDrop included.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            vcpkg-triplet: arm64-windows-static
            msvc-arch: arm64
            pe-machine: AA64 machine \(ARM64\)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the target's standard library to
      # the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      # libprojectM reads OpenGL through GLEW; projectm-sys builds against
      # vcpkg's static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        run: vcpkg install glew:${{ matrix.vcpkg-triplet }}
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      # No compiler cache: published binaries never build from outputs
      # restored from an Actions cache.
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # The zip and installer must run on a clean Windows machine without a
      # separately installed Visual C++ redistributable.
      - name: Verify standalone Windows runtime
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\lwspot.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "LWSpot imports an MSVC runtime:`n$runtime" }
          # The updater picks its download by the running executable's
          # architecture, so a binary of the wrong one under this name would
          # keep every copy installed from it on the wrong architecture.
          $headers = & dumpbin /headers $binary | Out-String
          if ($headers -notmatch '${{ matrix.pe-machine }}') { throw "$binary is not built for ${{ matrix.target }}:`n$headers" }
          $version = (& $binary --version | Out-String).Trim()
          if ($version -notmatch '^lwspot \d+\.\d+\.\d+') { throw "Unexpected --version output: $version" }

      # Asset names follow fastframe-update's release contract:
      # lwspot-<tag>-<target>.zip and lwspot-<tag>-<target>-setup.exe.
      - name: Portable zip
        shell: bash
        run: |
          name="lwspot-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/lwspot.exe" README.md LICENSE \
            packaging/lwspot-portable.txt "dist/$name/"
          cd dist && 7z a "$name.zip" "$name"

      # Inno Setup ships with the runner image. PowerShell, because bash on
      # Windows rewrites /D... arguments as paths.
      - name: Installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $arch = "${{ matrix.target }}".Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}\release\lwspot.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\lwspot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # The updater verifies every download against checksums.txt.
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.zip *-setup.exe > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: LWSpot ${{ github.ref_name }}
          generate_release_notes: true
          # A tag with a suffix (v0.1.0-rc1) is a pre-release: it stays off
          # "latest", so the app's update check never offers it.
          prerelease: ${{ contains(github.ref_name, '-') }}
