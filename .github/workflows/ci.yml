name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    # A cold cache (projectM through CMake, for the MilkDrop add-on) takes
    # about 30 minutes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Only the MilkDrop add-on (the milkdrop feature) needs these: libprojectM
      # reads OpenGL through GLEW, and projectm-sys builds against vcpkg's
      # static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        run: vcpkg install glew:${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-windows-static
      # Native tools on each runner: the action's default is x64, which on the
      # arm64 runner would compile under emulation.
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        if: runner.arch != 'ARM64'
        run: cargo fmt --all --check
      - name: Clippy (all features)
        if: runner.arch != 'ARM64'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy (MilkDrop add-on)
        if: runner.arch != 'ARM64'
        run: cargo clippy --locked --features milkdrop --bin lwspot-milkdrop -- -D warnings
      # lwspot.exe is built without the milkdrop feature; that is what these
      # test. The demo feature carries the headless render test that lays out
      # every page, panel, and dialog without a display.
      - name: Tests (app)
        run: cargo test --locked --all-targets --no-default-features
      - name: Tests (app, demo)
        run: cargo test --locked --all-targets --no-default-features --features demo
      # The MilkDrop window's own tests, which only the add-on compiles.
      - name: Tests (all features, with the MilkDrop add-on)
        run: cargo test --locked --all-targets --all-features
      - name: Native credential store (dummy grants)
        timeout-minutes: 2
        run: cargo test --locked --lib credentials::tests::native_store_round_trip -- --ignored --exact
      - name: Documentation tests
        run: cargo test --locked --all-features --doc
      # A build can pass while importing Microsoft's C++ runtime, then fail on
      # a clean user's machine. Inspect the executables CI actually produced:
      # the app, and the MilkDrop add-on it downloads.
      - name: Standalone Windows runtime
        shell: pwsh
        run: |
          cargo build --locked --bin lwspot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --features milkdrop --bin lwspot-milkdrop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $machine = if ($env:RUNNER_ARCH -eq 'ARM64') { 'AA64 machine \(ARM64\)' } else { '8664 machine \(x64\)' }
          foreach ($binary in 'target\debug\lwspot.exe', 'target\debug\lwspot-milkdrop.exe') {
            $imports = & dumpbin /dependents $binary | Out-String
            $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
            if ($runtime) { throw "$binary imports an MSVC runtime:`n$runtime" }
            $headers = & dumpbin /headers $binary | Out-String
            if ($headers -notmatch $machine) { throw "$binary is not built for $env:RUNNER_ARCH`:`n$headers" }
          }
      # The winget manifests fill in from a checksums.txt of this version.
      - name: winget manifests
        if: runner.arch != 'ARM64'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $checksums = "$env:RUNNER_TEMP\checksums.txt"
          ('0' * 64) + "  lwspot-v$version-setup.exe" | Set-Content $checksums
          ./packaging/winget/update-manifests.ps1 -Version $version -Checksums $checksums -OutDir "$env:RUNNER_TEMP\winget"
      # The release installer carries an x64 and an ARM64 build; this
      # compiles the script with this job's debug build in both places, to
      # catch syntax errors.
      - name: Windows installer syntax
        if: runner.arch != 'ARM64'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $binary = "$PWD\target\debug\lwspot.exe"
          & $iscc "/DVersion=$version" "/DBinaryX64=$binary" "/DBinaryArm64=$binary" "/DOutputDir=$env:RUNNER_TEMP\lwspot-installer-check" packaging\windows\lwspot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The Mac app (packaging/macos). Formatting is checked on Windows; the
  # rest runs here because the macOS code is only compiled on a Mac.
  macos:
    name: test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      # projectM, for the MilkDrop add-on, builds through CMake.
      - name: CMake
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests (app)
        run: cargo test --locked --all-targets --no-default-features
      - name: Tests (app, demo)
        run: cargo test --locked --all-targets --no-default-features --features demo
      - name: Tests (all features, with the MilkDrop add-on)
        run: cargo test --locked --all-targets --all-features
      - name: Documentation tests
        run: cargo test --locked --all-features --doc
      # The bundle, its icon, its Info.plist and its disk image, for this
      # runner's processor (the release builds the universal one).
      - name: App bundle
        run: |
          packaging/macos/build.sh --native
          plutil -lint dist/LWSpot.app/Contents/Info.plist
          test "$(dist/LWSpot.app/Contents/MacOS/lwspot --version)" = "lwspot $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
